# Nacos 配置文件 - 使用默认嵌入式数据库

### Server 配置
server.contextPath=/nacos
server.servlet.contextPath=/nacos
server.port=8848

### Tomcat 配置
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.pattern=%h %l %u %t "%r" %s %b %D %U %{X-Real-IP}i

### Nacos 配置
nacos.standalone=true

### 数据源配置 - 使用默认嵌入式数据库（Derby）
### 不设置 spring.datasource.platform，使用默认的 embedded

### Nacos 认证配置 - 关闭认证（开发环境）
nacos.core.auth.enabled=false
nacos.core.auth.caching.enabled=false

### 管理控制台配置
management.metrics.export.influx.enabled=false
management.metrics.export.elastic.enabled=false
management.endpoints.web.exposure.include=*

### 日志配置
nacos.logs.path=/home/nacos/logs

### 其他配置
nacos.naming.distro.taskDispatchThreadCount=1
nacos.naming.distro.taskDispatchPeriod=200
nacos.naming.distro.batchSyncKeyCount=1000
nacos.naming.distro.initDataRatio=0.9
nacos.naming.distro.syncRetryDelay=5000
