server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    compatibility-verifier:
      enabled: false  # Disable Spring Cloud compatibility check
  # Kafka configuration for async data collection
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: 1  # Wait for leader ack only (async)
      retries: 0  # No retries to avoid blocking
      linger-ms: 10  # 10ms batch wait
      buffer-memory: 33554432  # 32MB buffer

gateway:
  # Base URL of the orchestrator service
  orchestrator-base-url: http://localhost:8081
  # Request timeout in milliseconds
  timeout-ms: 5000
  # Enable request/response logging
  log-requests: true
  log-responses: true
  # Data collection settings
  data-collection:
    enabled: true
    async-publish: true
    topic: tx.events

# Nacos configuration for rule persistence
nacos:
  config:
    server-addr: localhost:8848
    namespace: public
    group-id: SENTINEL_GROUP
    flow-rules-dataId: ${spring.application.name}-flow-rules

# Sentinel configuration
spring.cloud.sentinel:
  transport:
    dashboard: localhost:8858  # Sentinel Dashboard address
    port: 8719                 # Sentinel API port
  eager: true                  # Enable early startup
  datasource:
    # Flow control rules - Nacos persistence
    flow:
      nacos:
        server-addr: ${nacos.config.server-addr}
        namespace: ${nacos.config.namespace}
        dataId: ${nacos.config.flow-rules-dataId}
        groupId: ${nacos.config.group-id}
        rule-type: flow
        data-type: json

# Spring Actuator configuration
management:
  endpoints:
    web:
      exposure:
        include: health  # Only expose health in production
      base-path: /actuator
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      simple:
        enabled: true

# Logging configuration
logging:
  level:
    root: INFO
    com.risk.gateway: DEBUG
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/gateway-service.log
    max-size: 100MB
    max-history: 30

# JSON serialization
spring.jackson:
  serialization:
    write-dates-as-timestamps: true
    indent-output: false
  default-property-inclusion: non_null
